<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniverse</title>
<style>
  :root {
    --bg: #eaf5fc; --card: #ffffff; --ink: #23324a; --sub: #5d6b80; --line: #d5e3ee; --accent: #e4573d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a26; --card: #1d2636; --ink: #e8eef7; --sub: #9aa8bc; --line: #2c3850; --accent: #ff7a5c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 48px 16px;
  }
  h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: .02em; }
  p.lead { margin: 0 0 32px; color: var(--sub); font-size: 15px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; width: 100%; max-width: 760px; }
  .place {
    display: block; padding: 22px 20px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--line); color: inherit; text-decoration: none;
    transition: transform .15s, box-shadow .15s;
  }
  a.place:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .emoji { font-size: 34px; }
  .name { margin: 10px 0 4px; font-size: 19px; font-weight: 700; }
  .desc { color: var(--sub); font-size: 14px; line-height: 1.5; }
  .soon { opacity: .55; }
  .tag { display: inline-block; margin-top: 10px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--line); color: var(--sub); }
  a.place .tag { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <h1>miniverse</h1>
  <p class="lead">상자, 원기둥, 원뿔, 공으로 쌓아 만든 작은 장소들을 걸어 다녀 보세요.</p>
  <div class="grid">
    <a class="place" href="school/">
      <div class="emoji">🏫</div>
      <div class="name">학교</div>
      <div class="desc">운동장과 시계탑이 있는 학교. 공을 차고 미끄럼틀 옆을 달려 보세요.</div>
      <span class="tag">들어가기</span>
    </a>
    <div class="place soon">
      <div class="emoji">🏖️</div>
      <div class="name">바닷가</div>
      <div class="desc">파도 소리가 들리는 모래사장.</div>
      <span class="tag">준비 중</span>
    </div>
  </div>
</body>
</html>
